name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build
        run: dotnet build SmarterMail.slnx -c Release

      - name: .NET tests
        run: dotnet test SmarterMail.slnx -c Release --no-build

      - name: Frontend tests
        run: node --test 'src/Agent/wwwroot/dev/test/*.test.mjs'

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: smartermail-mcp-user
            dockerfile: src/McpUser/Dockerfile
          - image: smartermail-mcp-admin
            dockerfile: src/McpAdmin/Dockerfile
          - image: smartermail-agent
            dockerfile: src/Agent/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Build both architectures without pushing; the build stage runs the tests again.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
