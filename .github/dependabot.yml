version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /src/McpUser
      - /src/McpAdmin
      - /src/Agent
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
